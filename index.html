<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人生转盘 · Life Wheel</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=ZCOOL+KuaiLe&display=swap');

  /* 像素风渲染：整站禁用抗锯齿，强化方块颗粒感 */
  * {
    -webkit-font-smoothing: none;
    -moz-osx-font-smoothing: none;
    font-smooth: never;
    text-rendering: geometricPrecision;
  }

  :root {
    --bg-dark: #1a1c2c;
    --bg-mid: #29366f;
    --pixel-pink: #ff77a8;
    --pixel-red: #ff004d;
    --pixel-yellow: #ffec27;
    --pixel-green: #00e436;
    --pixel-blue: #29adff;
    --pixel-purple: #7e2553;
    --pixel-white: #fff1e8;
    --pixel-gray: #5f574f;
    --pixel-dark: #111;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'ZCOOL KuaiLe', 'Press Start 2P', 'Courier New', monospace;
    background: var(--bg-dark);
    color: var(--pixel-white);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background-image:
      linear-gradient(rgba(255,255,255,0.04) 2px, transparent 2px),
      linear-gradient(90deg, rgba(255,255,255,0.04) 2px, transparent 2px);
    background-size: 16px 16px;
    image-rendering: pixelated;
  }

  /* 像素锯齿边框工具类：用 box-shadow 堆出台阶感 */
  .pixel-border {
    border: none;
    box-shadow:
      0 -4px 0 0 var(--pixel-white),
      0 4px 0 0 var(--pixel-white),
      -4px 0 0 0 var(--pixel-white),
      4px 0 0 0 var(--pixel-white),
      0 -8px 0 0 var(--pixel-dark),
      0 8px 0 0 var(--pixel-dark),
      -8px 0 0 0 var(--pixel-dark),
      8px 0 0 0 var(--pixel-dark);
  }

  .container {
    max-width: 900px;
    width: 100%;
    background: var(--bg-mid);
    padding: 30px;
    position: relative;
    /* 像素台阶边框 */
    box-shadow:
      0 0 0 4px var(--pixel-white),
      0 0 0 8px var(--pixel-dark),
      0 0 0 12px var(--pixel-white),
      12px 12px 0 12px rgba(0,0,0,0.5);
  }

  .container::before {
    content: '';
    position: absolute;
    inset: 4px;
    border: 2px dashed rgba(255,255,255,0.2);
    pointer-events: none;
  }

  h1 {
    font-family: 'Press Start 2P', monospace;
    text-align: center;
    color: var(--pixel-yellow);
    font-size: 24px;
    margin-bottom: 8px;
    text-shadow: 3px 3px 0 var(--pixel-red);
    letter-spacing: 2px;
  }

  .subtitle {
    text-align: center;
    color: var(--pixel-pink);
    font-size: 14px;
    margin-bottom: 30px;
    font-family: 'Press Start 2P', monospace;
  }

  /* ---- Setup Screen ---- */
  .setup { display: block; }
  .setup.hidden { display: none; }

  .form-group {
    margin-bottom: 20px;
  }

  label {
    display: block;
    font-size: 18px;
    margin-bottom: 8px;
    color: var(--pixel-yellow);
  }

  input, select {
    width: 100%;
    padding: 12px;
    font-family: 'ZCOOL KuaiLe', 'Courier New', monospace;
    font-size: 18px;
    background: var(--bg-dark);
    color: var(--pixel-white);
    border: none;
    outline: none;
    box-shadow:
      inset 0 0 0 2px var(--pixel-dark),
      0 0 0 3px var(--pixel-white);
  }

  input:focus, select:focus {
    box-shadow:
      inset 0 0 0 2px var(--pixel-dark),
      0 0 0 3px var(--pixel-yellow),
      0 0 0 6px var(--pixel-red);
  }

  .flag-group {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }

  .flag-option {
    padding: 12px;
    text-align: center;
    background: var(--bg-dark);
    border: none;
    cursor: pointer;
    font-size: 16px;
    user-select: none;
    transition: none;
    box-shadow:
      inset 0 0 0 2px var(--pixel-dark),
      0 0 0 3px var(--pixel-white);
  }

  .flag-option:hover {
    background: var(--pixel-purple);
    transform: translate(-2px, -2px);
    box-shadow: 4px 4px 0 var(--pixel-dark);
  }

  .flag-option.selected {
    background: var(--pixel-red);
    color: var(--pixel-yellow);
    box-shadow:
      inset 0 0 0 2px var(--pixel-dark),
      0 0 0 3px var(--pixel-yellow),
      0 0 0 6px var(--pixel-red);
  }

  .btn {
    display: block;
    width: 100%;
    padding: 16px;
    font-family: 'Press Start 2P', 'ZCOOL KuaiLe', monospace;
    font-size: 16px;
    background: var(--pixel-red);
    color: var(--pixel-white);
    border: none;
    cursor: pointer;
    letter-spacing: 2px;
    margin-top: 20px;
    transition: none;
    box-shadow:
      inset 0 -4px 0 0 rgba(0,0,0,0.4),
      0 0 0 4px var(--pixel-dark),
      0 0 0 8px var(--pixel-white),
      6px 6px 0 8px var(--pixel-dark);
  }

  .btn:hover {
    background: var(--pixel-pink);
    transform: translate(-2px, -2px);
    box-shadow:
      inset 0 -4px 0 0 rgba(0,0,0,0.4),
      0 0 0 4px var(--pixel-dark),
      0 0 0 8px var(--pixel-white),
      8px 8px 0 8px var(--pixel-dark);
  }

  .btn:active {
    transform: translate(2px, 2px);
    box-shadow:
      inset 0 -4px 0 0 rgba(0,0,0,0.4),
      0 0 0 4px var(--pixel-dark),
      0 0 0 8px var(--pixel-white),
      2px 2px 0 8px var(--pixel-dark);
  }

  .btn:disabled {
    background: var(--pixel-gray);
    cursor: not-allowed;
    opacity: 0.6;
  }

  /* ---- Game Screen ---- */
  .game { display: none; }
  .game.active { display: block; }

  .status-bar {
    display: grid;
    grid-template-columns: 1fr 1.3fr 1.3fr 0.8fr;
    gap: 12px;
    margin-bottom: 20px;
    padding: 15px 20px;
    background: var(--bg-dark);
    box-shadow:
      inset 0 0 0 2px var(--pixel-dark),
      0 0 0 3px var(--pixel-white);
  }

  .status-item {
    display: flex;
    justify-content: flex-start;
    align-items: center;
    gap: 12px;
    font-size: 16px;
  }

  .status-label { color: var(--pixel-yellow); }
  .status-value { color: var(--pixel-white); font-weight: bold; }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 20px;
  }

  .stat-box {
    background: var(--bg-dark);
    padding: 12px 8px;
    text-align: center;
    box-shadow:
      inset 0 0 0 2px var(--pixel-dark),
      0 0 0 3px var(--pixel-white);
  }

  .stat-icon { font-size: 24px; }
  .stat-name { font-size: 12px; color: var(--pixel-yellow); margin: 4px 0; }
  .stat-value { font-size: 22px; font-weight: bold; }
  .stat-bar {
    height: 6px;
    background: var(--pixel-gray);
    margin-top: 6px;
    position: relative;
    overflow: hidden;
  }
  .stat-fill {
    height: 100%;
    background: var(--pixel-green);
    transition: width 0.5s;
  }

  /* ---- Wheel ---- */
  .wheel-container {
    position: relative;
    width: 320px;
    height: 320px;
    margin: 20px auto;
  }

  .wheel-pointer {
    position: absolute;
    top: -10px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 32px;
    z-index: 10;
    filter: drop-shadow(0 2px 0 var(--pixel-dark));
  }

  .wheel {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    position: relative;
    transition: transform 1.6s cubic-bezier(0.17, 0.67, 0.32, 1.28);
    border: 6px solid var(--pixel-white);
    box-shadow: 0 0 0 4px var(--pixel-dark), 0 8px 0 4px var(--pixel-purple);
  }

  .wheel-center {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 60px;
    height: 60px;
    background: var(--pixel-yellow);
    border-radius: 50%;
    border: 4px solid var(--pixel-dark);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    z-index: 5;
  }

  .spin-btn {
    display: block;
    margin: 20px auto 0;
    padding: 14px 40px;
    font-family: 'Press Start 2P', monospace;
    font-size: 14px;
    background: var(--pixel-green);
    color: var(--pixel-dark);
    border: 4px solid var(--pixel-dark);
    cursor: pointer;
    letter-spacing: 2px;
    box-shadow: 4px 4px 0 var(--pixel-dark);
    transition: all 0.1s;
  }

  .spin-btn:hover:not(:disabled) {
    transform: translate(-2px, -2px);
    box-shadow: 6px 6px 0 var(--pixel-dark);
  }

  .spin-btn:disabled {
    background: var(--pixel-gray);
    cursor: not-allowed;
  }

  /* ---- Graduate Screen ---- */
  .graduate { display: none; }
  .graduate.active { display: block; }

  .grad-header { text-align: center; margin-bottom: 24px; }
  .grad-title {
    font-family: 'Press Start 2P', 'ZCOOL KuaiLe', monospace;
    font-size: 20px;
    color: var(--pixel-yellow);
    margin-bottom: 8px;
    text-shadow: 2px 2px 0 var(--pixel-red);
  }
  .grad-age { color: var(--pixel-pink); font-size: 15px; }

  .grad-options {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
  }
  .grad-card {
    background: var(--bg-dark);
    padding: 20px 12px;
    text-align: center;
    cursor: pointer;
    transition: none;
    box-shadow:
      inset 0 0 0 2px var(--pixel-dark),
      0 0 0 3px var(--pixel-white);
  }
  .grad-card:hover {
    background: var(--pixel-purple);
    transform: translate(-2px, -2px);
    box-shadow:
      inset 0 0 0 2px var(--pixel-dark),
      0 0 0 3px var(--pixel-yellow),
      6px 6px 0 3px var(--pixel-dark);
  }
  .grad-icon { font-size: 36px; margin-bottom: 8px; }
  .grad-label {
    font-size: 18px;
    color: var(--pixel-yellow);
    font-weight: bold;
    margin-bottom: 6px;
  }
  .grad-desc { font-size: 13px; color: var(--pixel-white); line-height: 1.4; opacity: 0.8; }

  /* 岔路事件卡片：加个金边强调"这是重要选择" */
  .event-card.crossroad {
    background: linear-gradient(135deg, var(--bg-mid), var(--pixel-purple));
    box-shadow: 8px 8px 0 var(--pixel-dark), 0 0 0 4px var(--pixel-yellow);
  }
  .event-card.crossroad .event-title {
    color: var(--pixel-yellow);
    text-shadow: 2px 2px 0 var(--pixel-red);
  }


  /* 事件分类配色：职业蓝 / 家庭粉 / 生活绿 */
  .event-card.cls-work .event-category { color: var(--pixel-blue, #29adff); }
  .event-card.cls-family .event-category { color: var(--pixel-pink, #ff77a8); }
  .event-card.cls-life .event-category { color: var(--pixel-green, #00e436); }
  .event-card.cls-family { box-shadow: 8px 8px 0 var(--pixel-dark), 0 0 0 4px var(--pixel-pink, #ff77a8); }
  .event-card.cls-work { box-shadow: 8px 8px 0 var(--pixel-dark), 0 0 0 4px #29adff; }

  /* 家庭事件历史条目 */
  .history-item.family { color: var(--pixel-pink, #ff77a8); }

  /* ---- Event Modal ---- */
  .event-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 20px;
    animation: fadeIn 0.3s;
  }

  .event-modal.active { display: flex; }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .event-card {
    max-width: 500px;
    width: 100%;
    background: var(--bg-mid);
    border: 4px solid var(--pixel-white);
    box-shadow: 8px 8px 0 var(--pixel-dark);
    padding: 30px;
    animation: slideUp 0.4s ease-out;
  }

  @keyframes slideUp {
    from { transform: translateY(30px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  .event-icon {
    font-size: 48px;
    text-align: center;
    margin-bottom: 12px;
  }

  .event-category {
    text-align: center;
    color: var(--pixel-yellow);
    font-size: 14px;
    margin-bottom: 8px;
    font-family: 'Press Start 2P', monospace;
  }

  .event-title {
    text-align: center;
    font-size: 22px;
    color: var(--pixel-white);
    margin-bottom: 16px;
    line-height: 1.4;
  }

  .event-desc {
    background: var(--bg-dark);
    border: 2px solid var(--pixel-gray);
    padding: 14px;
    font-size: 16px;
    line-height: 1.6;
    margin-bottom: 16px;
    color: var(--pixel-white);
  }

  .event-effects {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }

  .effect-tag {
    padding: 6px 12px;
    background: var(--bg-dark);
    border: 2px solid var(--pixel-white);
    font-size: 14px;
  }

  .effect-tag.positive { color: var(--pixel-green); border-color: var(--pixel-green); }
  .effect-tag.negative { color: var(--pixel-red); border-color: var(--pixel-red); }

  .choice-buttons {
    display: flex;
    gap: 10px;
    flex-direction: column;
  }

  #eventChoices {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .choice-btn {
    padding: 12px;
    font-family: 'ZCOOL KuaiLe', monospace;
    font-size: 16px;
    background: var(--bg-dark);
    color: var(--pixel-white);
    border: 3px solid var(--pixel-white);
    cursor: pointer;
    text-align: left;
    line-height: 1.4;
    transition: all 0.1s;
  }

  .choice-btn:hover {
    background: var(--pixel-purple);
    transform: translate(-2px, -2px);
    box-shadow: 4px 4px 0 var(--pixel-dark);
  }

  .close-event-btn {
    display: block;
    width: 100%;
    padding: 12px;
    font-family: 'Press Start 2P', monospace;
    font-size: 14px;
    background: var(--pixel-green);
    color: var(--pixel-dark);
    border: 3px solid var(--pixel-dark);
    cursor: pointer;
    letter-spacing: 2px;
  }

  /* ---- History ---- */
  .history {
    margin-top: 20px;
    padding: 15px;
    background: var(--bg-dark);
    max-height: 200px;
    overflow-y: auto;
    box-shadow:
      inset 0 0 0 2px var(--pixel-dark),
      0 0 0 3px var(--pixel-white);
  }

  .history-title {
    font-family: 'Press Start 2P', monospace;
    font-size: 12px;
    color: var(--pixel-yellow);
    margin-bottom: 10px;
  }

  .history-item {
    padding: 8px;
    border-bottom: 1px dashed var(--pixel-gray);
    font-size: 14px;
    line-height: 1.5;
  }

  .history-item:last-child { border-bottom: none; }

  .history-item.promo {
    color: var(--pixel-yellow);
    font-weight: bold;
    background: rgba(255, 236, 39, 0.08);
  }
  .history-age { color: var(--pixel-yellow); font-weight: bold; }

  /* ---- Ending Screen ---- */
  .ending { display: none; }
  .ending.active { display: block; }

  .ending-card {
    background: linear-gradient(135deg, var(--pixel-purple), var(--bg-mid));
    border: 4px solid var(--pixel-yellow);
    padding: 30px;
    text-align: center;
    box-shadow: 8px 8px 0 var(--pixel-dark);
  }

  .ending-title {
    font-family: 'Press Start 2P', monospace;
    font-size: 20px;
    color: var(--pixel-yellow);
    margin-bottom: 12px;
    text-shadow: 2px 2px 0 var(--pixel-red);
  }

  .ending-tag {
    font-size: 32px;
    color: var(--pixel-pink);
    margin: 20px 0;
    font-weight: bold;
  }

  .ending-desc {
    font-size: 16px;
    line-height: 1.6;
    margin-bottom: 20px;
    color: var(--pixel-white);
  }

  /* 人生总结文本卡片 */
  .life-summary {
    background: var(--bg-dark);
    padding: 20px 22px;
    margin: 20px 0;
    text-align: left;
    box-shadow:
      inset 0 0 0 2px var(--pixel-dark),
      0 0 0 3px var(--pixel-white);
    max-height: 320px;
    overflow-y: auto;
  }
  .life-summary-title {
    font-family: 'Press Start 2P', 'ZCOOL KuaiLe', monospace;
    font-size: 14px;
    color: var(--pixel-yellow);
    margin-bottom: 12px;
    text-shadow: 1px 1px 0 var(--pixel-red);
  }
  .life-summary-text {
    font-size: 15px;
    line-height: 1.8;
    color: var(--pixel-white);
    white-space: pre-wrap;
  }
  .summary-actions {
    display: flex;
    gap: 10px;
    margin: 15px 0 20px;
  }
  .summary-actions .btn {
    flex: 1;
    margin: 0;
    padding: 12px;
    font-size: 14px;
  }
  .btn-secondary {
    background: var(--pixel-purple) !important;
  }

  .final-stats {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin: 20px 0;
  }

  .final-stat {
    background: var(--bg-dark);
    padding: 12px;
    border: 2px solid var(--pixel-white);
    font-size: 16px;
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg-dark); }
  ::-webkit-scrollbar-thumb { background: var(--pixel-gray); border: 1px solid var(--pixel-white); }

  @media (max-width: 600px) {
    h1 { font-size: 18px; }
    .subtitle { font-size: 10px; }
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
    .wheel-container { width: 260px; height: 260px; }
  }
</style>
</head>
<body>

<div class="container">
  <h1>人生转盘</h1>
  <p class="subtitle">- LIFE WHEEL SIMULATOR -</p>

  <!-- ===== SETUP SCREEN ===== -->
  <div class="setup" id="setup">
    <div class="form-group">
      <label>🎮 玩家名字</label>
      <input type="text" id="playerName" placeholder="输入你的名字 / 花名" maxlength="12">
    </div>

    <div class="form-group">
      <label>🎓 学历</label>
      <select id="playerEdu">
        <option value="college">大专</option>
        <option value="bachelor" selected>本科</option>
        <option value="master">硕士（+3岁 +智力）</option>
        <option value="phd">博士（+6岁 +智力）</option>
      </select>
    </div>

    <button class="btn" id="goGradBtn">🎓 毕业啦，选择方向 →</button>
  </div>

  <!-- ===== GRADUATE SCREEN ===== -->
  <div class="graduate" id="graduate">
    <div class="grad-header">
      <div class="grad-title" id="gradTitle">-</div>
      <div class="grad-age" id="gradAge">-</div>
    </div>
    <div class="grad-options" id="gradOptions"></div>
  </div>

  <button style="display:none" id="startBtn"></button>

  <!-- ===== GAME SCREEN ===== -->
  <div class="game" id="game">
    <div class="status-bar">
      <div class="status-item">
        <span class="status-label">姓名</span>
        <span class="status-value" id="displayName">-</span>
      </div>
      <div class="status-item">
        <span class="status-label">路径</span>
        <span class="status-value" id="displayPath">-</span>
      </div>
      <div class="status-item">
        <span class="status-label">职级</span>
        <span class="status-value" id="displayLevel">-</span>
      </div>
      <div class="status-item">
        <span class="status-label">年龄</span>
        <span class="status-value" id="displayAge">-</span>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-box">
        <div class="stat-icon">💼</div>
        <div class="stat-name">事业</div>
        <div class="stat-value" id="statCareer">50</div>
        <div class="stat-bar"><div class="stat-fill" id="fillCareer" style="width:50%"></div></div>
      </div>
      <div class="stat-box">
        <div class="stat-icon">💰</div>
        <div class="stat-name">财富</div>
        <div class="stat-value" id="statWealth">50</div>
        <div class="stat-bar"><div class="stat-fill" id="fillWealth" style="width:50%"></div></div>
      </div>
      <div class="stat-box">
        <div class="stat-icon">❤️</div>
        <div class="stat-name">幸福</div>
        <div class="stat-value" id="statHappy">50</div>
        <div class="stat-bar"><div class="stat-fill" id="fillHappy" style="width:50%"></div></div>
      </div>
      <div class="stat-box">
        <div class="stat-icon">🧠</div>
        <div class="stat-name">智力</div>
        <div class="stat-value" id="statSmart">50</div>
        <div class="stat-bar"><div class="stat-fill" id="fillSmart" style="width:50%"></div></div>
      </div>
    </div>

    <div class="wheel-container">
      <div class="wheel-pointer">▼</div>
      <canvas id="wheelCanvas" class="wheel" width="320" height="320"></canvas>
      <div class="wheel-center">🎲</div>
    </div>

    <button class="spin-btn" id="spinBtn">转 动 命 运</button>

    <div class="history">
      <div class="history-title">📜 人生轨迹</div>
      <div id="historyList"></div>
    </div>
  </div>

  <!-- ===== ENDING SCREEN ===== -->
  <div class="ending" id="ending">
    <div class="ending-card">
      <div class="ending-title" id="endingTitle">✨ 人生总结 ✨</div>
      <div class="ending-tag" id="endingTag">-</div>

function makePartner(senior) {

  if (state.abroad && LOCAL_PARTNER_NAMES[state.abroad] && Math.random() < 0.7) {

function drawWheel() {
  const canvas = $('wheelCanvas');
  const ctx = canvas.getContext('2d');
  const cx = canvas.width / 2, cy = canvas.height / 2, r = cx - 4;
  const n = WHEEL_SECTORS.length;
  const anglePer = (Math.PI * 2) / n;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  WHEEL_SECTORS.forEach((sec, i) => {
    const start = i * anglePer - Math.PI / 2;
    const end = start + anglePer;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, start, end);
    ctx.closePath();
    ctx.fillStyle = sec.color;
    ctx.fill();
    ctx.strokeStyle = '#111';
    ctx.lineWidth = 3;
    ctx.stroke();

    ctx.save();
    ctx.translate(cx, cy);
    const midAngle = start + anglePer / 2;
    const textR = r * 0.68;
    ctx.translate(Math.cos(midAngle) * textR, Math.sin(midAngle) * textR);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#111';
    ctx.font = 'bold 22px monospace';
    ctx.fillText(sec.icon, 0, -10);
    ctx.font = 'bold 14px "ZCOOL KuaiLe", "Courier New", monospace';
    ctx.fillText(sec.label, 0, 12);
    ctx.restore();
  });

  ctx.beginPath();
  ctx.arc(cx, cy, 40, 0, Math.PI * 2);
  ctx.strokeStyle = '#111';
  ctx.lineWidth = 4;
  ctx.stroke();
}

function applyStat(effects) {
  Object.entries(effects || {}).forEach(([k,v]) => {
    if (k === 'age' || k === 'promo') return;
    if (['career','wealth','happy','smart'].includes(k)) {
      state[k] = Math.max(0, Math.min(100, state[k] + v));
    }
  });
  // 晋升点数
  if (effects && effects.promo) {
    state.promo += Math.round(effects.promo * state.promoRate);
    if (state.promo < 0) state.promo = 0;
    checkPromotion();
  }
}

// 一年一轮后，普通事件效果按比例缩放（岔路保持原值）
function scaleEffects(effects, factor) {
  if (!effects) return effects;
  const out = {};
  Object.entries(effects).forEach(([k, v]) => {
    if (k === 'promo') { out[k] = Math.max(1, Math.round(v * factor)) * Math.sign(v); return; }
    const sv = Math.round(v * factor);
    out[k] = sv === 0 && v !== 0 ? Math.sign(v) : sv;
  });
  return out;
}

// ===== 晋升检查 =====
function checkPromotion() {
  const track = CAREER_TRACKS[state.track];
  if (!track) return;
  let newLevel = state.level;
  while (newLevel + 1 < track.levels.length && state.promo >= track.promoNeed[newLevel + 1]) {
    newLevel++;
  }
  if (newLevel > state.level) {
    for (let l = state.level + 1; l <= newLevel; l++) {
      const bonus = track.levelBonus[l] || {};
      Object.entries(bonus).forEach(([k,v]) => {
        if (['career','wealth','happy','smart'].includes(k)) {
          state[k] = Math.max(0, Math.min(100, state[k] + v));
        }
      });
      state.history.push({ age: state.age, icon: '🎉', text: `晋升为「${track.levels[l]}」！`, isPromo: true });
    }
    state.level = newLevel;
    state.peakLevel = Math.max(state.peakLevel, newLevel);
    updateLevelDisplay();
    renderHistory();
  }
}

// ===== 转盘逻辑 =====
let wheelRotation = 0;
$('spinBtn').addEventListener('click', spin);

function spin() {
  if (state.isSpinning) return;
  state.isSpinning = true;
  $('spinBtn').disabled = true;

  const weights = getSectorWeights();
  const targetIdx = weightedPick(weights);
  const anglePer = 360 / WHEEL_SECTORS.length;
  const targetAngle = targetIdx * anglePer + anglePer / 2;
  const spins = 3 + Math.floor(Math.random() * 2);
  wheelRotation += spins * 360 + (360 - targetAngle - (wheelRotation % 360));
  $('wheelCanvas').style.transform = `rotate(${wheelRotation}deg)`;

  setTimeout(() => {
    const sector = WHEEL_SECTORS[targetIdx];
    triggerEvent(sector.key, sector.label);
  }, 1750);
}

function getSectorWeights() {
  const base = WHEEL_SECTORS.map(() => 1);
  const trackBoost = {
    corporate: { career: 1.3 },
    academic:  { study: 1.5, career: 1.2 },
    civil:     { social: 1.3, life: 1.2, career: 1.2 },
    diplomat:  { career: 1.5, study: 1.3, social: 1.2 },
    startup:   { career: 1.4, mystery: 1.3, wealth: 1.2 },
    freelance: { mystery: 1.3, life: 1.2, study: 1.2 },
  };
  const boost = trackBoost[state.track] || {};
  WHEEL_SECTORS.forEach((sec, i) => {
    if (boost[sec.key]) base[i] *= boost[sec.key];
  });
  return base;
}

function weightedPick(weights) {
  const total = weights.reduce((a,b)=>a+b, 0);
  let r = Math.random() * total;
  for (let i = 0; i < weights.length; i++) {
    r -= weights[i];
    if (r <= 0) return i;
  }
  return weights.length - 1;
}

// ===== 事件筛选（年龄窗口 + 状态门槛 + 晋升线）=====
function eligibleEvents(pool) {
  return pool.filter(ev => {
    if (ev.minAge && state.age < ev.minAge) return false;
    if (ev.maxAge && state.age > ev.maxAge) return false;
    if (ev.track && ev.track !== state.track) return false;
    if (ev.require && !ev.require(state)) return false;
    return true;
  });
}

// ===== 触发事件 =====
const CAREER_CATS = ['career','wealth','study'];
function triggerEvent(categoryKey, categoryLabel) {
  let pool = eligibleEvents(EVENTS[categoryKey]);
  if (pool.length === 0) pool = eligibleEvents(EVENTS.life); // 兜底
  if (pool.length === 0) pool = EVENTS.life;
  let ev = pool[Math.floor(Math.random() * pool.length)];

  // 致命事件：按 chance 概率生效，否则重抽一个非致命事件
  if (ev.fatal) {
    if (Math.random() > (ev.chance || 0.3)) {
      const safe = pool.filter(e => !e.fatal);
      ev = safe.length ? safe[Math.floor(Math.random() * safe.length)] : ev;
    }
  }

  if (ev.fatal) {
    showEventModal({
      icon: ev.icon, category: categoryLabel, title: ev.title, desc: ev.desc,
      effects: {}, choices: null,
      onDone: () => {
        state.history.push({ age: state.age, icon: ev.icon, text: ev.title });
        die(ev.minAge >= 50 ? 'illness' : 'accident');
      }
    });
    return;
  }

  // 事件分类标签：职业事件 / 家庭事件 / 生活事件
  const cls = CAREER_CATS.includes(categoryKey) ? 'work' : (categoryKey === 'love' ? 'family' : 'life');
  const clsLabel = { work:'职业事件', family:'家庭事件', life:'生活事件' }[cls];
  ev._cls = cls;

  // 构建当年的附加事件（恋爱线 + 家庭线）
  buildYearExtras(categoryKey);

  showEventModal({
    icon: ev.icon, category: `${clsLabel} · ${categoryLabel}`, title: ev.title, desc: ev.desc,
    effects: ev.effects, choices: ev.choices, setFlag: ev.setFlag, evClass: cls,
    onDone: (choiceText, effects, flag) => {
      if (flag) state[flag] = true;
      finishEvent(ev, choiceText, effects, false);
    }
  });
}

  card.classList.toggle('crossroad', !!isCrossroad);

  if (evClass) card.classList.add('cls-' + evClass);

  const effectsBox = $('eventEffects');
  const choicesBox = $('eventChoices');
  effectsBox.innerHTML = '';
  choicesBox.innerHTML = '';

  if (choices && choices.length) {
    choices.forEach(ch => {
      const btn = document.createElement('button');
      btn.className = 'choice-btn';
      btn.textContent = ch.text;
      btn.onclick = () => {

        const next = document.createElement('button');
        next.className = 'close-event-btn';
        next.textContent = '继续人生 →';
        next.onclick = () => {
          $('eventModal').classList.remove('active');
          onDone(ch.text, ch.effects, ch.setFlag);
        };
        choicesBox.appendChild(next);
      };
      choicesBox.appendChild(btn);
    });
  } else {
    renderEffects(effects, effectsBox);
    const btn = document.createElement('button');
    btn.className = 'close-event-btn';
    btn.textContent = '继续人生 →';
    btn.onclick = () => {
      $('eventModal').classList.remove('active');
      onDone(null, effects, setFlag);
    };
    choicesBox.appendChild(btn);
  }

  $('eventModal').classList.add('active');
}

function renderEffects(effects, container) {
  const labels = { career:'💼事业', wealth:'💰财富', happy:'❤️幸福', smart:'🧠智力', promo:'🚀晋升' };
  Object.entries(effects || {}).forEach(([k, v]) => {
    if (!v || k === 'age') return;
    if (!labels[k]) return;
    const tag = document.createElement('div');
    tag.className = 'effect-tag ' + (v > 0 ? 'positive' : 'negative');
    tag.textContent = `${labels[k]} ${v > 0 ? '+' : ''}${v}`;
    container.appendChild(tag);
  });
}

function finishEvent(ev, choiceText, effects, isCrossroad) {
  // 普通事件效果折半（一年一轮），岔路保持原值
  applyStat(isCrossroad ? effects : scaleEffects(effects, EVENT_SCALE));
  // 资历自然增长
  state.promo += Math.round(1.5 * state.promoRate);
  checkPromotion();
  const summary = choiceText ? `${ev.title}（${choiceText.replace(/^[ABC]\. /, '')}）` : ev.title;
  state.history.push({ age: state.age, icon: ev.icon, text: summary, cls: ev._cls });
  renderHistory();
  updateDisplay();
  processYearQueue();
}

// ===== 年度事件队列 =====
// 一年内可以发生多个事件：主事件（转盘）→ 恋爱线事件 → 家庭附加事件 → 年终结算
let yearQueue = [];

function processYearQueue() {
  if (state.dead) return;
  if (yearQueue.length > 0) {
    const job = yearQueue.shift();
    job();
  } else {
    endYear();
  }
}

function buildYearExtras(mainCategoryKey) {
  yearQueue = [];
  // 1. 恋爱线生命周期
  const loveJob = buildLoveLifecycle();
  if (loveJob) yearQueue.push(loveJob);
  // 2. 已婚/有娃：30% 概率同年再来一个家庭事件（主事件不是家庭类才给）
  if (mainCategoryKey !== 'love' && (state.married || state.hasKid) && Math.random() < 0.3) {
    const pool = eligibleEvents(EVENTS.love).filter(e => !e.fatal);
    if (pool.length) {
      const ev = pool[Math.floor(Math.random() * pool.length)];
      yearQueue.push(() => {
        ev._cls = 'family';
        showEventModal({
          icon: ev.icon, category: '家庭事件', title: ev.title, desc: ev.desc,
          effects: ev.effects, choices: ev.choices, setFlag: ev.setFlag, evClass:'family',
          onDone: (choiceText, effects, flag) => {
            if (flag) state[flag] = true;
            applyStat(scaleEffects(effects, EVENT_SCALE));
            const summary = choiceText ? `${ev.title}（${choiceText.replace(/^[ABC]\. /, '')}）` : ev.title;
            state.history.push({ age: state.age, icon: ev.icon, text: summary, cls:'family' });
            renderHistory();
            updateDisplay();
            processYearQueue();
          }
        });
      });
    }
  }
}

// ===== 恋爱生命周期 =====
function buildLoveLifecycle() {
  // --- 单身 → 邂逅 ---
  if (!state.dating && !state.married && !state.partner) {
    const youngSingle = state.age >= 20 && state.age <= 45;
    const seniorSingle = state.age >= 62 && (state.widowed || !state.married);
    const chance = youngSingle ? 0.35 : (seniorSingle ? 0.22 : 0);
    if (chance > 0 && Math.random() < chance) {
      const partner = makePartner(state.age >= 62);
      return () => {
        showEventModal({
          icon: partner.senior ? '🌇' : (partner.local ? partner.flag : '💘'),
          category: partner.local ? '家庭事件 · 异国邂逅' : '家庭事件 · 邂逅',
          title: partner.senior ? '黄昏里的相遇' : (partner.local ? '跨越山海的心动' : '怦然心动'),
          desc: `你参加${partner.scene}时，遇到了${partner.local ? partner.flag + ' 当地人' : ''}${partner.name}（${partner.tag.type}：${partner.tag.desc}）。聊了几句，感觉很不一样。`,
          choices: [
            { text: 'A. 主动出击，认识一下', effects: { happy:+8 } },
            { text: 'B. 缘分随风，保持距离', effects: { smart:+3 } },
          ],
          evClass: 'family',
          onDone: (choiceText, effects) => {
            applyStat(effects);
            if (choiceText && choiceText.startsWith('A')) {
              state.partner = partner;
              state.dating = true;
              state.datingYears = 0;
              if (partner.senior) state.seniorLove = true;
              state.history.push({ age: state.age, icon:'💘', text:`在${partner.scene}遇到了${partner.name}（${partner.tag.type}：${partner.tag.desc}），开始交往`, cls:'family' });
            } else {
              state.history.push({ age: state.age, icon:'🍂', text:`与${partner.name}擦肩而过`, cls:'family' });
            }
            renderHistory();
            updateDisplay();
            processYearQueue();
          }
        });
      };
    }
    return null;
  }

  // --- 恋爱中 → 修成正果 / 感情破裂 / 继续 ---
  if (state.dating && state.partner) {
    const p = state.partner;
    const marryChance = Math.min(0.7, 0.25 + state.datingYears * 0.15);
    const breakChance = 0.15;
    const roll = Math.random();
    if (state.datingYears >= 1 && roll < marryChance) {
      return () => {
        showEventModal({
          icon: p.senior ? '🌅' : '💍',
          category: '家庭事件 · 修成正果',
          title: p.senior ? '黄昏恋修成正果' : `${p.name}答应了！`,
          desc: p.senior
            ? `和${p.name}相伴的日子很踏实。你们决定领证，搭伙过好剩下的日子。`
            : `爱情长跑 ${state.datingYears} 年，你们决定结婚！${p.name}（${p.tag.type}：${p.tag.desc}）从此是你的家人。`,
          choices: [
            { text: 'A. 办一场热闹的婚礼', effects: { wealth:-15, happy:+18 } },
            { text: 'B. 领证旅行，简单就好', effects: { wealth:-3, happy:+14 } },
          ],
          evClass: 'family',
          onDone: (choiceText, effects) => {
            applyStat(effects);
            marry();
            state.history.push({ age: state.age, icon:'💍', text:`和${p.name}结婚了！`, cls:'family' });
            renderHistory();
            updateDisplay();
            processYearQueue();
          }
        });
      };
    }
    if (roll < marryChance + breakChance) {
      return () => {
        showEventModal({
          icon: '💔',
          category: '家庭事件 · 感情破裂',
          title: '走散了',
          desc: `和${p.name}的感情在琐碎和分歧里磨没了。你们和平分手，各自安好。`,
          effects: { happy:-10, smart:+4 },
          evClass: 'family',
          onDone: (_, effects) => {
            applyStat(effects);
            state.history.push({ age: state.age, icon:'💔', text:`和${p.name}分手了`, cls:'family' });
            state.partner = null;
            state.dating = false;
            state.datingYears = 0;
            state.breakups++;
            renderHistory();
            updateDisplay();
            processYearQueue();
          }
        });
      };
    }
    return null; // 平稳恋爱中
  }

  // --- 已婚 → 丧偶判定（65 岁起）---
  if (state.married && state.age >= 65 && !state.widowed) {
    const widowChance = Math.min(0.25, 0.03 + (state.age - 65) * 0.012);
    if (Math.random() < widowChance) {
      const pname = state.partner ? state.partner.name : '老伴';
      return () => {
        showEventModal({
          icon: '🕯️',
          category: '家庭事件 · 离别',
          title: '老伴走了',
          desc: `${pname}先走一步。收拾遗物时，你在抽屉里找到了你们年轻时的合影。`,
          effects: { happy:-18, smart:+5 },
          evClass: 'family',
          onDone: (_, effects) => {
            applyStat(effects);
            state.history.push({ age: state.age, icon:'🕯️', text:`${pname}离世，你送走了人生挚爱`, cls:'family' });
            state.married = false;
            state.widowed = true;
            state.partner = null;
            renderHistory();
            updateDisplay();
            processYearQueue();
          }
        });
      };
    }
  }
  return null;
}

function marry() {
  state.married = true;
  state.dating = false;
  state.marriedYears = 0;
  if (state.partner) {
    state.spouseTag = state.partner.tag;
    state.spouseLocal = state.partner.origin || state.partner.local || null;
    if (state.partner.senior) state.seniorLove = true;
  }
  state.widowed = false;
}

// ===== 年终结算 =====
function endYear() {
  state.age += 1;
  state.turnCount++;
  if (state.dating) state.datingYears++;
  if (state.married) state.marriedYears++;
  if (state.track === 'diplomat') {
    if (state.abroad) state.abroadYears++;
    else state.homeYears++;
  }
  updateDisplay();

  // 自然死亡判定：76 岁起逐年上升
  if (state.age >= 76) {
    const p = Math.min(0.5, 0.08 + (state.age - 76) * 0.045);
    if (Math.random() < p || state.turnCount >= state.maxTurns) {
      die('natural');
      return;
    }
  }
  if (state.turnCount >= state.maxTurns) {
    die('natural');
    return;
  }

  // 外交官轮岗：45 岁前国内三年 ↔ 国外三年
  if (state.track === 'diplomat' && state.age < 45) {
    if (!state.abroad && state.homeYears >= 3) {
      setTimeout(triggerPosting, 400);
      return;
    }
    if (state.abroad && state.abroadYears >= 3) {
      setTimeout(triggerReturn, 400);
      return;
    }
  }
  // 45 岁后若仍在国外，安排回国常驻
  if (state.track === 'diplomat' && state.age >= 45 && state.abroad) {
    setTimeout(triggerReturn, 400);
    return;
  }

  // 人生岔路：每 4 年一次
  if (state.turnCount % 4 === 0) {
    setTimeout(triggerCrossroad, 400);
  } else {
    state.isSpinning = false;
    $('spinBtn').disabled = false;
  }
}

// ===== 外交官轮岗事件 =====
function triggerPosting() {
  const country = pickPostingCountry();
  const hardshipNote = country.hardship ? '这是艰苦地区岗位，补贴高、提拔快，但条件艰苦。' : '';
  showEventModal({
    icon: country.flag,
    category: '职业事件 · 外派任命',
    title: `外派${country.name}！`,
    desc: `一纸调令：你被派驻${country.name}。${country.desc}。${hardshipNote}任期三年。`,
    effects: country.hardship
      ? { career:+6, smart:+5, promo:+8, happy:-4, wealth:+5 }
      : { career:+5, smart:+4, promo:+5, happy:+3 },
    evClass: 'work',
    onDone: (_, effects) => {
      applyStat(effects);
      state.abroad = country.name;
      state.abroadYears = 0;
      state.homeYears = 0;
      state.postings.push(country.name);
      state.history.push({ age: state.age, icon: country.flag, text: `外派${country.name}，任期三年` });
      // 异地恋考验：驻外且恋爱中，50% 概率分手
      if (state.dating && state.partner && !state.partner.local && Math.random() < 0.5) {
        const p = state.partner;
        state.history.push({ age: state.age, icon:'💔', text:`异国恋没能撑住，和${p.name}分手了`, cls:'family' });
        state.partner = null; state.dating = false; state.datingYears = 0; state.breakups++;
      }
      renderHistory();
      updateDisplay();
      state.isSpinning = false;
      $('spinBtn').disabled = false;
    }
  });
}

function triggerReturn() {
  const from = state.abroad;
  showEventModal({
    icon: '🛬',
    category: '职业事件 · 轮岗回国',
    title: '结束任期，回国了',
    desc: `驻${from}的任期结束，你回到部里工作。落地那一刻，最想吃的是一碗热腾腾的家乡味道。`,
    effects: { happy:+6, promo:+4 },
    evClass: 'work',
    onDone: (_, effects) => {
      applyStat(effects);
      state.abroad = null;
      state.abroadYears = 0;
      state.homeYears = 0;
      state.history.push({ age: state.age, icon:'🛬', text:`结束驻${from}任期，回国` });
      // 跨国恋人面临抉择：50% 跟随回国，否则分手
      if (state.dating && state.partner && state.partner.local === from) {
        const p = state.partner;
        if (Math.random() < 0.5) {
          state.history.push({ age: state.age, icon:'✈️', text:`${p.name}决定跟你来中国生活`, cls:'family' });
          state.partner.local = null; // 已随迁（origin 仍保留国籍）
        } else {
          state.history.push({ age: state.age, icon:'💔', text:`${p.name}不愿离开${from}，你们和平分手`, cls:'family' });
          state.partner = null; state.dating = false; state.datingYears = 0; state.breakups++;
        }
      }
      renderHistory();
      updateDisplay();
      state.isSpinning = false;
      $('spinBtn').disabled = false;
    }
  });
}

function triggerCrossroad() {
  const available = CROSSROADS.filter(c => {
    if (state.usedCrossroads.includes(c.id)) return false;
    if (c.minAge && state.age < c.minAge) return false;
    if (c.maxAge && state.age > c.maxAge) return false;
    if (c.require && !c.require(state)) return false;
    return true;
  });
  if (available.length === 0) {
    state.isSpinning = false;
    $('spinBtn').disabled = false;
    return;
  }
  const cr = available[Math.floor(Math.random() * available.length)];
  state.usedCrossroads.push(cr.id);

  showEventModal({
    icon: cr.icon,
    category: cr.title,
    title: cr.title,
    desc: cr.desc,
    choices: cr.choices,
    isCrossroad: true,
    onDone: (choiceText, effects, flag) => {
      if (flag) {
        state[flag] = true;
        if (flag === 'married') marry();
      }
      applyStat(effects);
      const summary = choiceText ? `${cr.title}（${choiceText.replace(/^[ABC]\. /, '')}）` : cr.title;
      state.history.push({ age: state.age, icon: cr.icon, text: summary });
      renderHistory();
      updateDisplay();
      // 岔路不占一年，直接解锁转盘
      state.isSpinning = false;
      $('spinBtn').disabled = false;
    }
  });
}

function renderHistory() {
  $('historyList').innerHTML = state.history.slice().reverse().map(h =>
    `<div class="history-item${h.isPromo ? ' promo' : ''}${h.cls === 'family' ? ' family' : ''}"><span class="history-age">${h.age}岁</span> ${h.icon} ${h.text}</div>`
  ).join('');
}

// ===== 结局 =====
function showEnding() {
  $('game').classList.remove('active');
  $('game').style.display = 'none';
  $('ending').classList.add('active');

  const c = Math.round(state.career), w = Math.round(state.wealth),
        h = Math.round(state.happy), s = Math.round(state.smart);
  const total = c + w + h + s;

  let ending = ENDINGS[ENDINGS.length - 1];
  // 早逝专属结局
  if (state.deathCause === 'accident' && state.age < 55) {
    ending = { tag:'天妒英才', desc:`人生本来还有无限可能，却在 ${state.age} 岁戛然而止。愿来世平安顺遂。` };
  } else if (state.deathCause === 'illness' && state.age < 65) {
    ending = { tag:'英年早逝', desc:`病魔无情。${state.age} 岁的你带着未完成的心愿离开了。` };
  } else if (state.seniorLove && (state.married || state.widowed) && state.age >= 70) {
    // 隐藏结局：黄昏恋
    ending = { tag:'🌅 夕阳无限好', desc:'谁说爱情只属于年轻人？你在人生的黄昏遇到了对的人，最后的岁月被温柔填满。', hidden:true };
  } else if (state.track === 'diplomat' && state.spouseLocal && state.married) {
    // 隐藏结局：外交官跨国婚姻
    ending = { tag:'🌍 山海不为远', desc:`外交生涯带你走过 ${state.postings.length} 个国家，也带来了跨越山海的爱情。你和来自${state.spouseLocal}的爱人，把两种人生过成了一种。`, hidden:true };
  } else if (state.track === 'diplomat' && state.postings.includes('厄立特里亚') && state.level >= 5) {
    // 隐藏结局：从厄立特里亚走出的大使
    ending = { tag:'🇪🇷 从厄立特里亚出发', desc:'从红海之滨最艰苦的馆开始，一步步走到公使、大使。多年后你总说：最想念的还是阿斯马拉的咖啡。', hidden:true };
  } else if (state.spouseTag && state.spouseTag.type === '颜值' && state.marriedYears >= 30 && state.happy >= 70) {
    // 隐藏结局：神仙眷侣
    ending = { tag:'💫 神仙眷侣', desc:`和${state.spouseTag.desc}的爱人携手 ${state.marriedYears} 年，你们是朋友圈里永远的模范夫妻。`, hidden:true };
  } else if (state.marriedYears >= 40) {
    // 隐藏结局：白头偕老
    ending = { tag:'👴👵 白头偕老', desc:`一段婚姻走了 ${state.marriedYears} 年。所谓爱情最好的样子，就是一起慢慢变老。`, hidden:true };
  } else if (state.breakups >= 3) {
    // 隐藏结局：情场浪子
    ending = { tag:'🃏 情场浪子', desc:`${state.breakups} 段感情无疾而终。爱过、痛过、潇洒过，你的故事够写一本书。`, hidden:true };
  } else {
    for (const e of ENDINGS) {
      if (e.minCareer && c >= e.minCareer) { ending = e; break; }
      if (e.minWealth && w >= e.minWealth) { ending = e; break; }
      if (e.minHappy && h >= e.minHappy) { ending = e; break; }
      if (e.minSmart && s >= e.minSmart) { ending = e; break; }
      if (e.total !== undefined && total >= e.total) { ending = e; break; }
    }
  }

  // 职级成就覆盖：达到晋升线顶级/次顶级，结局标签升级
  const track = CAREER_TRACKS[state.track];
  const topTags = {
    corporate: ['执掌一方的 CEO', '叱咤商界'],
    academic:  ['桃李天下的院士', '学界泰斗'],
    civil:     ['国之栋梁', '为民请命一辈子'],
    diplomat:  ['共和国大使', '外交战线的传奇'],
    startup:   ['敲钟上市的传奇', '商业帝国缔造者'],
    freelance: ['行业标杆', '自由而丰盛'],
  };
  let levelTitle = track ? track.levels[state.level] : '';

  if ($('endingTitle')) {
    const causeLabel = { accident:'💫 意外离世', illness:'🏥 因病离世', natural:'🕊️ 寿终正寝' }[state.deathCause] || '';
    $('endingTitle').textContent = `✨ ${state.age} 岁 · ${causeLabel || '人生总结'} ✨`;
  }
  $('endingTag').textContent = ending.tag;
  $('endingDesc').textContent = ending.desc;
  $('finalCareer').textContent = c;
  $('finalWealth').textContent = w;
  $('finalHappy').textContent = h;
  $('finalSmart').textContent = s;

  $('lifeSummary').textContent = buildLifeSummary(ending, { c, w, h, s, total }, levelTitle);
}

// ===== 人生总结生成 =====
function buildLifeSummary(ending, stats, levelTitle) {
  const { c, w, h, s } = stats;
  const name = state.name || '这位朋友';
  const eduMap = { college:'大专', bachelor:'本科', master:'硕士', phd:'博士' };
  const edu = eduMap[state.edu] || '本科';
  const track = CAREER_TRACKS[state.track];

  // 毕业选择
  const gradPath = GRADUATE_PATHS[state.gradPath];
  let gradText = '';
  if (gradPath) {
    if (state.gradSubPath) {
      const sub = gradPath.subs.find(x => x.id === state.gradSubPath);
      gradText = `${edu}毕业后，你选择进入${sub ? sub.label : gradPath.label}，从一名${track ? track.levels[0] : '新人'}做起。`;
    } else if (state.gradPath === 'study') {
      gradText = `${edu}毕业后，你选择继续深造，走上了学术之路。`;
    } else if (state.gradPath === 'gaokao') {
      if (state.track === 'diplomat') {
        gradText = `${edu}毕业后，你被外交部选中，从随员干起，开始了国内外轮岗的外交生涯。`;
      } else {
        gradText = `${edu}毕业后，你考公上岸，从${track ? track.levels[0] : '科员'}干起。`;
      }
    } else if (state.gradPath === 'startup') {
      gradText = `${edu}毕业后，你没有选择打工，而是直接创业当了老板。`;
    } else if (state.gradPath === 'gapyear') {
      gradText = `${edu}毕业后，你先 Gap 了一年去看世界，然后走上了自由职业的路。`;
    }
  }

  // 职级成就
  let careerText = '';
  if (track && state.level > 0) {
    const pct = state.level / (track.levels.length - 1);
    if (pct >= 0.99) {
      careerText = `职业生涯堪称传奇——你一路做到了「${levelTitle}」，站上了这条路的最顶端。`;
    } else if (pct >= 0.6) {
      careerText = `职业上你走得很远，最终做到了「${levelTitle}」，足以让大多数同龄人仰望。`;
    } else if (pct >= 0.3) {
      careerText = `职业上稳步前行，做到了「${levelTitle}」，不算惊艳但足够踏实。`;
    } else {
      careerText = `职业停在了「${levelTitle}」，或许职级从来就不是你人生的重心。`;
    }
  } else if (track) {
    careerText = `职级上你始终是${track.levels[0]}，但人生的价值从不只有升职这一个刻度。`;
  }
  // 外交生涯足迹
  if (state.postings && state.postings.length > 0) {
    careerText += `外交生涯里你先后驻过${state.postings.join('、')}${state.postings.length > 1 ? ' ' + state.postings.length + ' 个国家' : ''}，护照上的每一个章都是故事。`;
  }

  // 家庭线
  let familyText = '';
  const spouseName = state.partner ? state.partner.name : null;
  if (state.married || state.widowed || state.marriedYears > 0) {
    const tagStr = state.spouseTag ? `（${state.spouseTag.type}：${state.spouseTag.desc}）` : '';
    if (state.widowed) {
      familyText = `你曾拥有一段 ${state.marriedYears} 年的婚姻${tagStr ? '，爱人' + tagStr : ''}，虽然最后送走了对方，但那些相伴的岁月是你最珍贵的收藏。`;
    } else if (spouseName) {
      familyText = `你和${spouseName}${tagStr}携手走过 ${state.marriedYears} 年。`;
      if (state.spouseLocal) familyText += `这段始于${state.spouseLocal}的跨国婚姻，让两种文化在一个屋檐下开花。`;
    } else {
      familyText = `你的婚姻走过了 ${state.marriedYears} 年。`;
    }
    if (state.hasKid) familyText += '孩子的欢笑和鸡飞狗跳都是生活的注脚。';
  } else if (state.breakups > 0) {
    familyText = `${state.breakups} 段感情最终都没能走到最后，但每一段都让你更懂得爱与被爱。`;
  } else {
    familyText = '你没有走进婚姻，一个人把日子过成了自己喜欢的样子。';
  }
  if (state.hasHouse) familyText += '名下有一套属于自己的房子，那是你安全感的来源之一。';

  // 事件回顾
  const events = state.history.filter(x => !x.text.startsWith('毕业选择') && !x.isPromo);
  let eventText = '';
  if (events.length >= 3) {
    const first = events[0];
    const mid = events[Math.floor(events.length / 2)];
    const last = events[events.length - 1];
    eventText = `\n\n回望这几十年：\n· ${first.age}岁那年，"${first.text}"让你第一次感受到人生的变数；\n· ${mid.age}岁时经历的"${mid.text}"，影响深远；\n· 而${last.age}岁的"${last.text}"，为人生后半程添上独特一笔。`;
  }

  // 岔路
  const usedCr = state.usedCrossroads.length;
  let crText = usedCr > 0 ? `\n\n人生的岔路口，你做了 ${usedCr} 次重要选择。有些选对了，有些回头看未必最优——但正是这些决定塑造了今天的你。` : '';

  // 四维画像
  const dims = [
    { name:'事业', val:c, high:'事业上你走到了别人仰望的位置', mid:'事业稳中有进', low:'事业一直起起伏伏' },
    { name:'财富', val:w, high:'财富早已不是烦恼', mid:'手头宽裕日子踏实', low:'钱包始终是心事' },
    { name:'幸福', val:h, high:'你是身边人羡慕的幸福样本', mid:'日子有滋有味', low:'快乐来得少去得快' },
    { name:'智力', val:s, high:'谈吐里都藏着智慧', mid:'认知在稳步生长', low:'认知停在了年轻时' },
  ];
  const dimText = d => d.val >= 75 ? d.high : d.val >= 45 ? d.mid : d.low;
  const strongest = dims.slice().sort((a,b)=>b.val-a.val)[0];
  const weakest = dims.slice().sort((a,b)=>a.val-b.val)[0];

  const closingMap = {
    '职场传奇': '如果重来一次，你大概还是会选这条路。',
    '财富自由': '钱不是万能的，但没有钱是万万不能的——这句话你比谁都懂。',
    '幸福赢家': '别人问你成功的秘诀，你只会笑着说：不较劲。',
    '智慧长者': '晚辈们喜欢来找你聊天，因为你总能给出他们没想过的角度。',
    '人生赢家': '四平八稳，各得其所，这就是所谓的圆满吧。',
    '佛系人生': '不焦虑不攀比，日子慢慢过，这也是一种赢。',
    '普通打工人': '和大多数人一样起起落落，但你活出了自己的节奏。',
    '跌宕人生': '大起大落都经历过，这才叫真正活过。',
    '黯淡收场': '如果人生可以重来……下一局，一定会不一样。',
  };
  const closing = closingMap[ending.tag] || '这就是属于你的人生。';

  // 寿命开场白
  let lifeSpanText;
  if (state.deathCause === 'accident') {
    lifeSpanText = `${name}（${edu}），生命停在了 ${state.age} 岁——一场意外带走了一切。`;
  } else if (state.deathCause === 'illness') {
    lifeSpanText = `${name}（${edu}），${state.age} 岁因病离世。`;
  } else if (state.age >= 90) {
    lifeSpanText = `${name}（${edu}），享年 ${state.age} 岁——妥妥的长寿人生。`;
  } else if (state.age >= 76) {
    lifeSpanText = `${name}（${edu}），享年 ${state.age} 岁，走完了完整的一生。`;
  } else {
    lifeSpanText = `${name}（${edu}），${state.age} 岁。`;
  }

  return `${lifeSpanText}\n\n` +
    `${gradText}${careerText}\n\n${familyText}` +
    `${eventText}${crText}\n\n` +
    `到了这个年纪回头看：${dimText(strongest)}，但${dimText(weakest)}。` +
    `最终你以「${ending.tag}」收场——${ending.desc}\n\n${closing}`;
}

// ===== 复制 & 分享 =====
function copySummary() {
  const text = $('lifeSummary').textContent;
  navigator.clipboard.writeText(text).then(() => {
    alert('已复制到剪贴板，可以发给朋友炫耀啦～');
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    alert('已复制到剪贴板～');
  });
}

function shareSummary() {
  const tag = $('endingTag').textContent;
  const track = CAREER_TRACKS[state.track];
  const levelTitle = track ? track.levels[state.level] : '';
  const c = $('finalCareer').textContent, w = $('finalWealth').textContent,
        h = $('finalHappy').textContent, s = $('finalSmart').textContent;
  const summary = $('lifeSummary').textContent;
  const shareText =
    `🎮 我在【人生转盘】里的结局是：${tag}${levelTitle ? '（' + levelTitle + '）' : ''}\n\n` +
    `💼事业 ${c} | 💰财富 ${w}\n` +
    `❤️幸福 ${h} | 🧠智力 ${s}\n\n` +
    `${summary}\n\n———\n你也来玩一把：${location.href.split('#')[0]}`;
  navigator.clipboard.writeText(shareText).then(() => {
    alert('战绩卡已复制，粘贴到群里让大家看看你的人生～');
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = shareText;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    alert('战绩卡已复制～');
  });
}

</script>
</body>
</html>
